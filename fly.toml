# fly.toml app configuration file generated for datingapp-omar on 2026-07-06T11:17:15+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'datingapp-omar'
primary_region = 'cdg'

[build]
  image = 'omarsaadeh/datingapp:latest'

[env]
  ASPNETCORE_URLS="http://+:8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256

[mounts]
  source = "datingapp_images"
  destination = "/app/wwwroot/images"