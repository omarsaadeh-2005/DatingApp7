<div class="container mt-5">
    <div *ngIf="!(accountService.currentUser$ | async)" style="text-align: center;">
        <div *ngIf="!registerMode">
            <h1>Find your match</h1>
            <p class="lead">Come on in to view your matches... all you need to do is sign up!</p>
            <div class="text-center">
                <button (click)="registerToggle()" class="btn btn-primary btn-lg me-2">Register</button>
                <button class="btn btn-info btn-lg">Learn more</button>
            </div>
        </div>

        <div *ngIf="registerMode" class="container">
            <div class="row justify-content-center">
                <div class="col-4">
                    <app-register (cancelRegister)="cancelRegisterMode($event)"></app-register>
                </div>
            </div>
        </div>
    </div>

    <!-- Shown when user IS logged in and clicks 'Dating App' logo -->
    <div *ngIf="accountService.currentUser$ | async" class="text-center">
        <h1>Welcome Back!</h1>
        <p class="lead">Ready to explore your matches?</p>
        <button routerLink="/members" class="btn btn-primary btn-lg">View Matches</button>
    </div>
</div>
